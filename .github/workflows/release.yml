name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          zip -r strong-password-generator.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "*.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: strong-password-generator.zip
          generate_release_notes: true
